name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: masyarakat
          POSTGRES_PASSWORD: masyarakat
          POSTGRES_DB: masyarakat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://masyarakat:masyarakat@localhost:5432/masyarakat?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - if: matrix.app == 'backend'
        run: npx prisma migrate deploy
      - run: npm test
      - if: matrix.app == 'frontend'
        run: npm run build
