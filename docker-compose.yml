services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: masyarakat
      POSTGRES_PASSWORD: masyarakat
      POSTGRES_DB: masyarakat
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # ADR-014: local S3-compatible storage for development (SeaweedFS; MinIO no longer publishes free images).
  # No credentials are enforced, so any S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY works. Create the bucket once:
  #   docker run --rm --network host -e AWS_ACCESS_KEY_ID=x -e AWS_SECRET_ACCESS_KEY=x amazon/aws-cli \
  #     --endpoint-url http://localhost:9000 --region us-east-1 s3 mb s3://masyarakat
  storage:
    image: chrislusf/seaweedfs
    command: server -s3 -dir=/data
    ports:
      - "9000:8333"
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:
