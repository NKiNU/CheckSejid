# ADR-026: production on one DigitalOcean Droplet. Values come from .env next to this file (template:
# .env.example). Deploy with ops/deploy.sh.
# Fixed project name, so this stack never shares containers or volumes with the development
# docker-compose.yml in the same folder.
name: masyarakat
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    build: ./frontend
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    restart: unless-stopped
    logging: *logging

  api:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://masyarakat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/masyarakat?schema=public"
      CLAMD_HOST: clamd:3310
      TRUST_PROXY: "1" # behind Caddy, so rate limits key on the real client IP
    volumes:
      - erasure-keys:/var/lib/masyarakat/erasure-keys # ADR-031 §6: archive keys, never in backups
    depends_on:
      db: { condition: service_healthy }
      clamd: { condition: service_started }
    restart: unless-stopped
    logging: *logging

  # ADR-025 §2. Downloads signatures on start (a minute or two); uploads get 503 until it is ready.
  clamd:
    image: clamav/clamav:stable
    volumes: [clamav-db:/var/lib/clamav]
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: masyarakat
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: masyarakat
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "masyarakat"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  clamav-db:
  db-data:
  erasure-keys:
